<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Khmer OS Siemreap', sans-serif; background-color: #0f172a; color: white; }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">ទាញយកវីដេអូ YouTube</h1>
            <p class="text-sm text-slate-400">សូមបញ្ចូលតំណភ្ជាប់ (Link) វីដេអូនៅខាងក្រោម</p>
        </div>

        <div class="mb-4">
            <input type="text" id="urlInput" placeholder="ឧទាហរណ៍: https://youtu.be/..." 
                class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <button onclick="handleDownload()" id="downloadBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors flex justify-center items-center gap-2">
            <span>ទាញយកវីដេអូឥឡូវនេះ</span>
        </button>

        <div id="statusArea" class="mt-6 flex flex-col items-center justify-center hidden">
            <div class="loader" id="spinner"></div>
            <p id="statusText" class="text-sm text-blue-400 mt-3 text-center">កំពុងដំណើរការ... សូមរង់ចាំ!</p>
        </div>
    </div>

    <p class="text-xs text-slate-500 mt-8 text-center max-w-xs">
        ដំណើរការដោយ Smart API (ស័ក្តិសមសម្រាប់ iPhone)។
    </p>

    <script>
        async function handleDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusArea = document.getElementById('statusArea');
            const spinner = document.getElementById('spinner');
            const statusText = document.getElementById('statusText');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!urlInput.includes("youtube.com") && !urlInput.includes("youtu.be")) {
                alert("សូមបញ្ចូល Link វីដេអូ YouTube ឱ្យបានត្រឹមត្រូវ!");
                return;
            }

            statusArea.classList.remove('hidden');
            spinner.style.display = 'block';
            statusText.innerText = "កំពុងស្វែងរកវីដេអូ... (សូមរង់ចាំ)";
            statusText.className = "text-sm text-yellow-400 mt-3 text-center";
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // សាកល្បងហៅទៅកាន់ API ម៉ាស៊ីនមេទី១
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vQuality: "720"
                    })
                });

                if (!response.ok) throw new Error("Load failed");

                const data = await response.json();

                if (data.url) {
                    statusText.innerText = "✅ វីដេអូរួចរាល់! កំពុងបើកឯកសារ...";
                    statusText.className = "text-sm text-green-400 mt-3 text-center";
                    spinner.style.display = 'none';
                    window.location.href = data.url;
                } else {
                    throw new Error("មិនអាចទាញយកបាន");
                }

            } catch (error) {
                // ដំណោះស្រាយទី២ (Fallback)៖ បើ Safari Block វាបញ្ជូនទៅទំព័រទាញយកដោយស្វ័យប្រវត្តិ
                spinner.style.display = 'none';
                statusText.innerText = "Safari កំពុងរារាំង... កំពុងបញ្ជូនទៅទំព័រទាញយកសុវត្ថិភាព!";
                statusText.className = "text-sm text-blue-400 mt-3 text-center";
                
                setTimeout(() => {
                    window.location.href = `https://cobalt.tools/?url=${encodeURIComponent(urlInput)}`;
                }, 1500);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
